<text x="20" y="337" fill="#ffd166" font-weight="700">&#160;&#160;✓ FLAG ACCEPTED: tokens rooted.</text>
<text x="20" y="358" fill="#ffd166" font-weight="700">&#160;&#160;Lesson: A JWT is just base64url JSON. Servers must pin the expected algorithm and never accept &quot;alg...</text>
