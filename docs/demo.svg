<text x="20" y="274" fill="#c9f5d6">}</text>
<text x="20" y="295"><tspan fill="#39ff88">guest@tokens:~$</tspan><tspan fill="#c9f5d6"> submit NR{&#8226;&#8226;&#8226;&#8226;&#8226;&#8226;&#8226;&#8226;&#8226;&#8226;&#8226;&#8226;}</tspan></text>
